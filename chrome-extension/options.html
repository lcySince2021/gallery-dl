<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Gallery-DL 设置</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 400px;
      margin: 40px auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      color: #e4e4e7;
      background: #18181b;
      padding: 24px;
    }
    h2 { margin-bottom: 20px; font-size: 16px; }
    label { display: block; margin-bottom: 4px; color: #a1a1aa; font-size: 12px; }
    input {
      width: 100%;
      padding: 8px 10px;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      color: #e4e4e7;
      font-size: 13px;
      margin-bottom: 14px;
      outline: none;
    }
    input:focus { border-color: #3b82f6; }
    button {
      padding: 9px 20px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    .saved { margin-left: 10px; color: #34d399; font-size: 13px; }
    .hint { color: #52525b; font-size: 11px; margin-top: -10px; margin-bottom: 14px; }
    .mode-title { font-size: 13px; color: #e4e4e7; margin-bottom: 6px; }
    .mode-desc { font-size: 11px; color: #71717a; margin-top: 6px; margin-bottom: 18px; }
    .seg { display: flex; background: #27272a; border: 1px solid #3f3f46; border-radius: 6px; padding: 2px; }
    .seg label { flex: 1; margin: 0; }
    .seg input { position: absolute; opacity: 0; width: 0; height: 0; margin: 0; padding: 0; border: 0; }
    .seg span { display: block; text-align: center; padding: 6px 0; font-size: 12px; color: #a1a1aa; border-radius: 4px; cursor: pointer; transition: background .15s, color .15s; }
    .seg input:checked + span { background: #3b82f6; color: #fff; }
    .bot-config.disabled { opacity: .4; pointer-events: none; }
  </style>
</head>
<body>
  <h2>Gallery-DL 设置</h2>
  <div class="mode-title">下载方式</div>
  <div class="seg">
    <label><input type="radio" name="mode" value="bot"><span>发送到 Bot</span></label>
    <label><input type="radio" name="mode" value="local"><span>下载到本地</span></label>
    <label><input type="radio" name="mode" value="ask"><span>每次询问</span></label>
  </div>
  <div class="mode-desc" id="modeDesc"></div>
  <div class="bot-config" id="botConfig">
    <label>服务器地址</label>
    <input type="text" id="serverUrl" placeholder="http://192.168.123.7:8088">
    <p class="hint">NAS 的局域网 IP + 端口 8080</p>
    <label>Chat ID（你的 Telegram 用户 ID）</label>
    <input type="text" id="chatId" placeholder="123456789">
    <button id="save">保存</button>
    <span class="saved" id="saved"></span>
  </div>
  <script src="options.js"></script>
</body>
</html>
